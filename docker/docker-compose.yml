services:

  mongodb:

     image : mongo:7-jammy

     container_name : mongodb

     ports :
        - "27007:27017"

     volumes :
        - mongodata:/data/db
     environment :
        - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
        - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
     networks:
        - mini-rag-network

     restart : always

networks:
  mini-rag-network:

volumes:
  mongodata:
   